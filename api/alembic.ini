[alembic]
# %(here)s resolves against this file, so `alembic -c /srv/api/alembic.ini` works from
# any working directory.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# The URL is injected from Settings in env.py rather than duplicated here, so there is
# one place a credential can be wrong.
sqlalchemy.url =
