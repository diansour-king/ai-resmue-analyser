name: careerlayer

# The provider configuration the API and the worker both read. Values come from .env;
# unset ones arrive as empty strings, which settings.py treats as "not configured".
x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-claude-opus-5}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_INFERENCE_GEO: ${LLM_INFERENCE_GEO:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
  LLM_MAX_OUTPUT_TOKENS_EXTRACTION: ${LLM_MAX_OUTPUT_TOKENS_EXTRACTION:-4096}
  LLM_MAX_OUTPUT_TOKENS_MATCHING: ${LLM_MAX_OUTPUT_TOKENS_MATCHING:-8192}
  LLM_CACHE_TTL: ${LLM_CACHE_TTL:-5m}
  LLM_DATA_PROCESSING_MODE: ${LLM_DATA_PROCESSING_MODE:-disabled}
  LLM_PRIVACY_ATTESTATION_ID: ${LLM_PRIVACY_ATTESTATION_ID:-}
  LLM_PRIVACY_VERIFIED_AT: ${LLM_PRIVACY_VERIFIED_AT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A one-shot container rather than an entrypoint script on the API, so that bucket
  # creation cannot silently re-run on every API restart or mask a storage outage as
  # a slow boot.
  minio-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${S3_BUCKET}
    restart: "no"

  api:
    build:
      # Repo root, not ./api: the API will import packages/integrity from phase 3 onward
      # and a narrower context would have to be widened later.
      context: ..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      ENVIRONMENT: ${ENVIRONMENT}
      <<: *llm-env
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ../api:/srv/api
      - ../packages/scoring:/srv/packages/scoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully

  worker:
    build:
      # A separate image from the API on purpose: this is the only service that needs
      # Tesseract, and the API has no reason to carry an OCR engine to write a row.
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      ENVIRONMENT: ${ENVIRONMENT}
      <<: *llm-env
    volumes:
      - ../worker:/srv/worker
      - ../packages/integrity:/srv/packages/integrity
      - ../packages/scoring:/srv/packages/scoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      # Server-side only. The browser talks to this container and nothing else, which is what
      # keeps the API host, the database and the object store off the public network.
      API_ORIGIN: http://api:8000
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
