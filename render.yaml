# Render Blueprint for CareerLayer — free-tier layout.
#
# Creates: a managed Postgres, a managed Key Value (Redis), and two web services built from
# the Dockerfiles in this repo.
#
# Render has no free "background worker" plan, so the API service runs on the *worker*
# image (which carries Tesseract and every package) and starts the RQ worker alongside
# uvicorn in one container. Trade-off: a free web service sleeps after ~15 min idle, so
# background processing only happens while someone is using the app. To split them back
# out, restore a `type: worker` service on `plan: starter` using ./worker/Dockerfile and
# drop the `python -m careerlayer_worker.main &` from the API command below.
#
# Object storage is NOT part of this blueprint — Render has no S3 service. Create a bucket
# on any S3-compatible provider (Supabase Storage and Cloudflare R2 both have free tiers)
# and fill in the five S3_* values marked `sync: false` in the Render dashboard, on the
# API service. See docs/deployment.md for the walk-through.

databases:
  - name: careerlayer-db
    plan: free           # free Postgres is deleted after 30 days; upgrade to keep the data
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- Redis / queue + sessions
  - type: keyvalue
    name: careerlayer-redis
    plan: free
    ipAllowList: []       # reachable only from other services in this blueprint
    maxmemoryPolicy: noeviction   # the RQ job queue must not have entries evicted

  # ---------------------------------------------------------------- API + RQ worker (one box)
  - type: web
    name: careerlayer-api
    runtime: docker
    plan: free
    dockerfilePath: ./worker/Dockerfile   # carries Tesseract + careerlayer_api + worker
    dockerContext: .
    # migrate, then start the RQ worker in the background, then uvicorn in the foreground.
    # The logic is in a script so there is no shell quoting to get wrong here.
    dockerCommand: sh /srv/worker/start-web.sh
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlayer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: careerlayer-redis
          property: connectionString
      # Demo auth: `development` returns the magic-link in the API response so anyone can
      # sign in without a mail server. COOKIE_SECURE re-adds the Secure flag that
      # `development` would otherwise drop, since Render serves HTTPS.
      - key: ENVIRONMENT
        value: development
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_DATA_PROCESSING_MODE
        value: disabled
      # --- object storage: set these in the dashboard --------------------------------------
      - key: S3_ENDPOINT_URL
        sync: false   # Supabase: https://<ref>.supabase.co/storage/v1/s3
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false   # careerlayer-resumes
      - key: S3_REGION
        sync: false   # Supabase: the project region, e.g. us-east-1 (Cloudflare R2: auto)

  # ---------------------------------------------------------------- Next.js (public entry)
  - type: web
    name: careerlayer-web
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    dockerCommand: npx next start -p $PORT
    envVars:
      # The browser only ever talks to this service; /v1/* is proxied server-side to the
      # API. Redundant with the default in next.config.mjs, and kept only so the wiring is
      # visible here — the default is what actually holds, because a code deploy does not
      # re-read this file. See the note in docs/deployment.md.
      - key: API_ORIGIN
        value: https://careerlayer-api.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
