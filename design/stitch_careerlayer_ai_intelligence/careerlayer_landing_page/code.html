your strengths, and discover what to improve
next.</p>

</button>

</main>
<script>
        // Optional: Add scroll effect to navbar to increase glassmorphism
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('bg-white/20');
                nav.classList.remove('bg-white/10');
            } else {
                nav.classList.add('bg-white/10');
                nav.classList.remove('bg-white/20');
            }
        });
    </script>
