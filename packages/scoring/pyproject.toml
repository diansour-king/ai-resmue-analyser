[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerlayer-scoring"
version = "0.1.0"
description = "Deterministic match scoring engine for CareerLayer."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
careerlayer-scoring = "careerlayer.scoring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["careerlayer"]
