[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerlayer-integrity"
version = "0.1.0"
description = "Detects attempts to manipulate a reader hidden inside a PDF resume."
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "rapidfuzz>=3.9",
  "pydantic>=2.9",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
careerlayer-integrity = "careerlayer.integrity.cli:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["careerlayer"]
